<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹強化打磚塊</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 95vw;
            max-width: 480px;
            padding: 10px 15px;
            background: #181824;
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid #2a2a3d;
            font-size: 1rem;
            font-weight: bold;
        }
        .header span {
            color: #00f5d4;
        }
        canvas {
            background: radial-gradient(circle at center, #161622 0%, #0d0d12 100%);
            display: block;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 95vw;
            max-width: 480px;
            aspect-ratio: 3 / 4;
            cursor: none;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>關卡: <span id="level">1</span></div>
        <div>分數: <span id="score">0</span></div>
        <div>最高: <span id="highscore">0</span></div>
        <div>生命: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div class="legend">
        <div><span class="badge" style="background:#00f5d4;">W</span> 加寬板子</div>
        <div><span class="badge" style="background:#fee440;">M</span> 分身多球</div>
        <div><span class="badge" style="background:#f15bb5;">P</span> 穿透火球</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲狀態
        let score = 0;
        let highScore = localStorage.getItem("neonBreakoutHigh") || 0;
        let level = 1;
        let lives = 3;
        let gameState = "START"; // START, PLAYING, GAMEOVER

        document.getElementById("highscore").textContent = highScore;

        // 反彈板設定
        const paddle = {
            baseWidth: 90,
            width: 90,
            height: 14,
            x: (canvas.width - 90) / 2,
            y: canvas.height - 35,
            color: "#00bbf9",
            wideTimer: 0
        };

        // 球與道具陣列
        let balls = [];
        let powerUps = [];
        let particles = [];

        // 磚塊設定
        const brickConfig = {
            rows: 5,
            cols: 7,
            padding: 8,
            offsetTop: 50,
            offsetLeft: 20,
            height: 22
        };
        brickConfig.width = (canvas.width - brickConfig.offsetLeft * 2 - brickConfig.padding * (brickConfig.cols - 1)) / brickConfig.cols;

        let bricks = [];

        // 顏色對應血量 (1血, 2血, 3血)
        const hpColors = ["", "#00f5d4", "#00bbf9", "#f15bb5"];

        function initBricks() {
            bricks = [];
            const currentRows = Math.min(brickConfig.rows + Math.floor((level - 1) / 2), 8);
            for (let r = 0; r < currentRows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    // 根據關卡決定磚塊血量 (1~3)
                    let maxHp = 1;
                    if (r === 0 && level >= 2) maxHp = 3;
                    else if (r <= 1) maxHp = 2;
                    
                    bricks[r][c] = {
                        x: c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft,
                        y: r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop,
                        hp: maxHp
                    };
                }
            }
        }

        function resetBall() {
            const speed = 4.5 + (level - 1) * 0.4;
            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 12,
                dx: (Math.random() > 0.5 ? 1 : -1) * (speed * 0.7),
                dy: -speed,
                radius: 7,
                speed: speed,
                pierceTimer: 0
            }];
            paddle.width = paddle.baseWidth;
            paddle.wideTimer = 0;
            powerUps = [];
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: color
                });
            }
        }

        function spawnPowerUp(x, y) {
            if (Math.random() > 0.25) return; // 25% 掉落率
            const types = [
                { type: "WIDE", label: "W", color: "#00f5d4" },
                { type: "MULTI", label: "M", color: "#fee440" },
                { type: "PIERCE", label: "P", color: "#f15bb5" }
            ];
            const chosen = types[Math.floor(Math.random() * types.length)];
            powerUps.push({
                x: x,
                y: y,
                radius: 12,
                dy: 2.5,
                ...chosen
            });
        }

        function applyPowerUp(p) {
            if (p.type === "WIDE") {
                paddle.width = paddle.baseWidth * 1.5;
                paddle.wideTimer = 600; // 約10秒
            } else if (p.type === "MULTI") {
                const newBalls = [];
                balls.forEach(b => {
                    if (balls.length + newBalls.length < 12) { // 限制最多12顆球避免卡頓
                        newBalls.push({
                            ...b,
                            dx: -b.dx + (Math.random() - 0.5) * 2,
                            dy: -Math.abs(b.dy)
                        });
                    }
                });
                balls = balls.concat(newBalls);
            } else if (p.type === "PIERCE") {
                balls.forEach(b => b.pierceTimer = 420); // 約7秒穿透火球
            }
        }

        // 控制監聽 (滑鼠 + 手機觸控)
        function movePaddle(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let relativeX = (clientX - rect.left) * scaleX;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
        }

        canvas.addEventListener("mousemove", e => movePaddle(e.clientX));
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            movePaddle(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener("click", () => {
            if (gameState === "START" || gameState === "GAMEOVER") {
                score = 0;
                level = 1;
                lives = 3;
                updateUI();
                initBricks();
                resetBall();
                gameState = "PLAYING";
            }
        });

        function updateUI() {
            document.getElementById("score").textContent = score;
            document.getElementById("level").textContent = level;
            document.getElementById("lives").textContent = "❤️".repeat(lives);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neonBreakoutHigh", highScore);
                document.getElementById("highscore").textContent = highScore;
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            // 板子加寬倒數
            if (paddle.wideTimer > 0) {
                paddle.wideTimer--;
                if (paddle.wideTimer === 0) paddle.width = paddle.baseWidth;
            }

            // 更新道具掉落
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += p.dy;

                // 檢查板子是否接到道具
                if (p.y + p.radius >= paddle.y && p.y - p.radius <= paddle.y + paddle.height &&
                    p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
                    applyPowerUp(p);
                    score += 50;
                    updateUI();
                    powerUps.splice(i, 1);
                } else if (p.y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // 更新所有球
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                if (b.pierceTimer > 0) b.pierceTimer--;

                b.x += b.dx;
                b.y += b.dy;

                // 左右牆壁反彈
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.dx = -b.dx;
                } else if (b.x + b.radius > canvas.width) {
                    b.x = canvas.width - b.radius;
                    b.dx = -b.dx;
                }

                // 頂部反彈
                if (b.y - b.radius < 0) {
                    b.y = b.radius;
                    b.dy = -b.dy;
                }

                // 撞擊反彈板 (根據撞擊點改變反射角度)
                if (b.dy > 0 && b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.height &&
                    b.x >= paddle.x && b.x <= paddle.x + paddle.width) {
                    let hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    let angle = hitPoint * (Math.PI / 3); // 最大60度角
                    b.dx = b.speed * Math.sin(angle);
                    b.dy = -b.speed * Math.cos(angle);
                    b.y = paddle.y - b.radius;
                }

                // 撞擊磚塊
                let activeBricks = 0;
                for (let r = 0; r < bricks.length; r++) {
                    for (let c = 0; c < bricks[r].length; c++) {
                        let br = bricks[r][c];
                        if (br.hp > 0) {
                            activeBricks++;
                            if (b.x + b.radius > br.x && b.x - b.radius < br.x + brickConfig.width &&
                                b.y + b.radius > br.y && b.y - b.radius < br.y + brickConfig.height) {
                                
                                // 若不是穿透火球才反彈
                                if (b.pierceTimer <= 0) {
                                    b.dy = -b.dy;
                                }
                                
                                createParticles(br.x + brickConfig.width / 2, br.y + brickConfig.height / 2, hpColors[br.hp]);
                                br.hp--;
                                score += 10 * level;
                                updateUI();

                                if (br.hp === 0) {
                                    activeBricks--;
                                    spawnPowerUp(br.x + brickConfig.width / 2, br.y + brickConfig.height / 2);
                                }
                            }
                        }
                    }
                }

                // 過關判定
                if (activeBricks === 0) {
                    level++;
                    updateUI();
                    initBricks();
                    resetBall();
                    return;
                }

                // 球掉出底部
                if (b.y - b.radius > canvas.height) {
                    balls.splice(i, 1);
                }
            }

            // 所有球都掉光才扣命
            if (balls.length === 0) {
                lives--;
                updateUI();
                if (lives <= 0) {
                    gameState = "GAMEOVER";
                } else {
                    resetBall();
                }
            }

            // 更新粒子特效
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].dx;
                particles[i].y += particles[i].dy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫磚塊
            for (let r = 0; r < bricks.length; r++) {
                for (let c = 0; c < bricks[r].length; c++) {
                    let br = bricks[r][c];
                    if (br.hp > 0) {
                        ctx.fillStyle = hpColors[br.hp];
                        ctx.beginPath();
                        ctx.roundRect(br.x, br.y, brickConfig.width, brickConfig.height, 4);
                        ctx.fill();
                    }
                }
            }

            // 畫反彈板
            ctx.fillStyle = paddle.wideTimer > 0 ? "#00f5d4" : paddle.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 畫道具
            powerUps.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.label, p.x, p.y);
            });

            // 畫球
            balls.forEach(b => {
                ctx.fillStyle = b.pierceTimer > 0 ? "#f15bb5" : "#ffffff";
                ctx.shadowBlur = b.pierceTimer > 0 ? 15 : 8;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 畫碎片粒子
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / 20;
                ctx.fillRect(pt.x, pt.y, 4, 4);
                ctx.globalAlpha = 1;
            });

            // 開始與結束畫面覆蓋層
            if (gameState === "START" || gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(13, 13, 18, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.font = "bold 32px sans-serif";
                ctx.fillText(gameState === "START" ? "霓虹強化打磚塊" : "遊戲結束", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#00f5d4";
                ctx.font = "18px sans-serif";
                ctx.fillText("點擊畫面開始遊戲", canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#888";
                ctx.font = "14px sans-serif";
                ctx.fillText("電腦移動滑鼠 / 手機滑動螢幕控制板子", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initBricks();
        loop();
    </script>
</body>
</html>
